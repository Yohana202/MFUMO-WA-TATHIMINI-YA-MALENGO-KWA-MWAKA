<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Goals & Financial System</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; color: #333; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1, h2 { text-align: center; color: #1a365d; margin-bottom: 20px; }
        .auth-section, .app-section { margin-bottom: 20px; }
        .hidden { display: none !important; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; color: #4a5568; }
        input, select { width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 16px; }
        button { width: 100%; padding: 12px; background-color: #2b6cb0; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        button:hover { background-color: #2c5282; }
        .btn-danger { background-color: #e53e3e; }
        .btn-danger:hover { background-color: #c53030; }
        .card { background: #edf2f7; padding: 15px; border-radius: 8px; margin-bottom: 15px; border-left: 5px solid #2b6cb0; }
        .card-title { font-weight: bold; font-size: 18px; color: #2d3748; }
        .card-details { font-size: 14px; color: #718096; margin-top: 5px; }
        .user-header { display: flex; justify: space-between; align-items: center; background: #ebf8ff; padding: 10px 15px; border-radius: 6px; margin-bottom: 20px; }
    </style>
    
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Firebase Configuration yako
        const firebaseConfig = {
            apiKey: "AIzaSyDzMmcwSYRZg_kGXqixZqjQemAG7k4twIE",
            authDomain: "family-goals-system.firebaseapp.com",
            projectId: "family-goals-system",
            storageBucket: "family-goals-system.firebasestorage.app",
            messagingSenderId: "938650283930",
            appId: "1:938650283930:web:ea4fb2e549d26d32c95423"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;

        // Elements
        const authSection = document.getElementById('authSection');
        const appSection = document.getElementById('appSection');
        const userEmailDisplay = document.getElementById('userEmailDisplay');
        const authForm = document.getElementById('authForm');
        const authTitle = document.getElementById('authTitle');
        const authBtn = document.getElementById('authBtn');
        const toggleAuthBtn = document.getElementById('toggleAuthBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const goalForm = document.getElementById('goalForm');
        const goalsList = document.getElementById('goalsList');

        let isLogin = true;

        // Toggle Login / Register
        toggleAuthBtn.addEventListener('click', () => {
            isLogin = !isLogin;
            authTitle.innerText = isLogin ? "Ingia kwenye Mfumo (Login)" : "Sajili Akaunti Mpya";
            authBtn.innerText = isLogin ? "Ingia" : "Tengeneza Akaunti";
            toggleAuthBtn.innerText = isLogin ? "Huna akaunti? Sajili hapa" : "Unayo akaunti? Ingia hapa";
        });

        // Authentication Handler
        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                if (isLogin) {
                    await signInWithEmailAndPassword(auth, email, password);
                } else {
                    await createUserWithEmailAndPassword(auth, email, password);
                }
            } catch (error) {
                alert("Kosa: " + error.message);
            }
        });

        // Track Auth State
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                userEmailDisplay.innerText = user.email;
                authSection.classList.add('hidden');
                appSection.classList.remove('hidden');
                loadGoals();
            } else {
                currentUser = null;
                authSection.classList.remove('hidden');
                appSection.classList.add('hidden');
            }
        });

        // Logout
        logoutBtn.addEventListener('click', () => signOut(auth));

        // Add Goal / Financial Record
        goalForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('goalTitle').value;
            const amount = document.getElementById('goalAmount').value;
            const category = document.getElementById('goalCategory').value;

            try {
                await addDoc(collection(db, "goals"), {
                    userId: currentUser.uid,
                    title: title,
                    amount: Number(amount),
                    category: category,
                    createdAt: new Date().toISOString()
                });
                goalForm.reset();
                loadGoals();
            } catch (error) {
                alert("Imeshindwa kuhifadhi: " + error.message);
            }
        });

        // Load Goals from Cloud Firestore
        async function loadGoals() {
            goalsList.innerHTML = "<p>Inapakia taarifa...</p>";
            try {
                const q = query(collection(db, "goals"), where("userId", "==", currentUser.uid));
                const querySnapshot = await getDocs(q);
                goalsList.innerHTML = "";
                
                if (querySnapshot.empty) {
                    goalsList.innerHTML = "<p>Haujaweka lengo au kumbukumbu yoyote bado.</p>";
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="card-title">${data.title}</div>
                        <div class="card-details">
                            <strong>Aina:</strong> ${data.category} | 
                            <strong>Kiasi:</strong> TZS ${data.amount.toLocaleString()}
                        </div>
                    `;
                    goalsList.appendChild(card);
                });
            } catch (error) {
                goalsList.innerHTML = "<p style='color:red;'>Tatizo limetokea wakati wa kupakia taarifa.</p>";
            }
        }
    </script>
</head>
<body>

    <div class="container">
        <!-- SEHEMU YA LOGIN / REGISTER -->
        <div id="authSection" class="auth-section">
            <h1 id="authTitle">Ingia kwenye Mfumo (Login)</h1>
            <form id="authForm">
                <div class="form-group">
                    <label for="email">Barua Pepe (Email):</label>
                    <input type="email" id="email" required placeholder="mfano@gmail.com">
                </div>
                <div class="form-group">
                    <label for="password">Nenosiri (Password):</label>
                    <input type="password" id="password" required placeholder="******">
                </div>
                <button type="submit" id="authBtn">Ingia</button>
            </form>
            <button id="toggleAuthBtn" style="background: none; color: #2b6cb0; margin-top: 15px; font-weight: normal;">Huna akaunti? Sajili hapa</button>
        </div>

        <!-- SEHEMU YA MFUMO WA MALENGO NA FEDHA -->
        <div id="appSection" class="app-section hidden">
            <div class="user-header">
                <span>Akaunti: <strong id="userEmailDisplay"></strong></span>
                <button id="logoutBtn" class="btn-danger" style="width: auto; padding: 6px 15px;">Toka (Logout)</button>
            </div>

            <h2>Mfumo wa Malengo na Akiba</h2>

            <!-- FORM YA KUINGIZA DATA -->
            <form id="goalForm" style="margin-bottom: 30px;">
                <div class="form-group">
                    <label for="goalTitle">Jina la Lengo / Akiba:</label>
                    <input type="text" id="goalTitle" required placeholder="Mfano: Akiba ya Duka la Stationery">
                </div>
                <div class="form-group">
                    <label for="goalAmount">Kiasi cha Fedha (TZS):</label>
                    <input type="number" id="goalAmount" required placeholder="250000">
                </div>
                <div class="form-group">
                    <label for="goalCategory">Aina ya Kumbukumbu:</label>
                    <select id="goalCategory">
                        <option value="Lengo la Biashara">Lengo la Biashara</option>
                        <option value="Akiba ya Benki">Akiba ya Benki</option>
                        <option value="Matumizi ya Familia">Matumizi ya Familia</option>
                    </select>
                </div>
                <button type="submit">Hifadhi Kwenye Cloud</button>
            </form>

            <hr style="margin-bottom: 20px;">

            <h3>Orodha ya Malengo Yako Mtandaoni</h3>
            <div id="goalsList" style="margin-top: 15px;">
                <!-- Hapa Data Zitakaa -->
            </div>
        </div>
    </div>

</body>
</html>
